<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Hub Pro</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

<div class="sidebar" id="sidebar">
    <button onclick="showTab('home')">الرئيسية</button>
    <button onclick="showTab('prompts')">البرومبتات</button>
    <button onclick="showTab('categories')">الأقسام</button>
    <button onclick="showTab('notifications')">الإشعارات</button>
</div>

<div class="main">

<!-- HOME -->
<div id="home" class="tab active">
    <h1>Home</h1>
    <div id="stats"></div>
    <div id="homeGrid"></div>
</div>

<!-- PROMPTS -->
<div id="prompts" class="tab hidden">

<h2>Prompts</h2>

<button onclick="toggleForm()">+ إضافة</button>

<div id="form" class="hidden">

<input id="title" placeholder="title">
<input type="file" id="imageUpload">
<input id="image" placeholder="image url">

<select id="category"></select>

<textarea id="prompt"></textarea>

<button onclick="savePrompt()">حفظ</button>

</div>

<div id="list"></div>

</div>

<!-- CATEGORIES -->
<div id="categories" class="tab hidden">
<input id="catName">
<button onclick="addCategory()">Add</button>
<div id="catList"></div>
</div>

<!-- NOTIFICATIONS -->
<div id="notifications" class="tab hidden">
<input id="notifTitle">
<input id="notifDesc">
<button onclick="addNotification()">Add</button>
<div id="notifList"></div>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
