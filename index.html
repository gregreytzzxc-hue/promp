<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Hub</title>

<link rel="stylesheet" href="style.css">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <button onclick="showTab('home')">الرئيسية</button>
    <button onclick="showTab('prompts')">البرومبتات</button>
    <button onclick="showTab('categories')">الأقسام</button>
    <button onclick="showTab('notifications')">الإشعارات</button>
</div>

<div class="main">

<!-- HOME -->
<div id="home" class="tab active">
    <h1>Dashboard</h1>
    <div id="stats"></div>
    <div id="homeGrid"></div>
</div>

<!-- PROMPTS -->
<div id="prompts" class="tab hidden">

<h2>Prompts</h2>

<button onclick="toggleForm()">+ إضافة برومبت</button>

<div id="form" class="hidden">

<input id="title" placeholder="Title">
<input id="image" placeholder="Image URL">
<input type="file" id="imageUpload">

<select id="category"></select>

<textarea id="prompt" placeholder="Prompt"></textarea>
<textarea id="desc" placeholder="Description"></textarea>

<input id="videoLink" placeholder="Video link">

<label>
<input type="checkbox" id="showHome"> Show Home
</label>

<button onclick="savePrompt()">حفظ</button>

</div>

<div id="list"></div>

</div>

<!-- CATEGORIES -->
<div id="categories" class="tab hidden">
<input id="catName">
<button onclick="addCategory()">Add Category</button>
<div id="catList"></div>
</div>

<!-- NOTIFICATIONS -->
<div id="notifications" class="tab hidden">
<input id="notifTitle">
<input id="notifDesc">
<button onclick="addNotification()">Add</button>
<div id="notifList"></div>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
